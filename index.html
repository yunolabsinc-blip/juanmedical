<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주안메디칼 취급 제품</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f7f8fa; color: #1a1a1a; }
header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 1.2rem 1.5rem; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 17px; font-weight: 600; }
header p { font-size: 12px; color: #6b7280; margin-top: 2px; }
.tabs { display: flex; padding: 0 1.5rem; background: #fff; border-bottom: 1px solid #e5e7eb; }
.tab { padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; color: #6b7280; background: none; border-top: none; border-left: none; border-right: none; }
.tab.active { color: #1a5c3a; border-bottom-color: #1a5c3a; }
.content { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
.section-label { font-size: 12px; color: #6b7280; margin-bottom: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 10px; }
.card-icon { width: 48px; height: 48px; background: #f0f9f4; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.card-name { font-size: 15px; font-weight: 600; }
.card-type { font-size: 11px; color: #9ca3af; }
.card-btn { font-size: 12px; color: #1a5c3a; border: 1px solid #1a5c3a; border-radius: 8px; padding: 6px 0; background: transparent; cursor: pointer; width: 100%; margin-top: auto; }
.card-btn:hover { background: #f0f9f4; }
.pharma-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pharma-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem 1rem; display: flex; align-items: center; justify-content: center; min-height: 70px; text-align: center; font-size: 14px; font-weight: 600; color: #374151; }
.contact-bar { margin-top: 2rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.contact-bar p { font-size: 13px; color: #6b7280; }
.contact-bar strong { display: block; font-size: 15px; margin-top: 2px; }
.contact-btn { padding: 8px 20px; border-radius: 8px; border: none; background: #1a5c3a; color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>주안메디칼</h1>
  <p>의료기기 · 전문의약품 취급</p>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('device')">의료기기 (10)</button>
  <button class="tab" onclick="showTab('pharma')">전문의약품 (7)</button>
</div>
<div class="content">
  <div id="tab-device">
    <p class="section-label">취급 의료기기 목록</p>
    <div class="grid" id="device-grid"></div>
  </div>
  <div id="tab-pharma" class="hidden">
    <p class="section-label">파트너 제약사 — 제품 문의는 하단 연락처로 주세요.</p>
    <div class="pharma-grid" id="pharma-grid"></div>
  </div>
  <div class="contact-bar">
    <div>
      <p>제품 문의 · 브로셔 요청</p>
      <strong>주안메디칼 담당자 직통</strong>
    </div>
    <button class="contact-btn">전화 문의</button>
  </div>
</div>
<script>
var d=['리오젠','카라젠','운드클랏','리젠씰','카티졸','리젠패치','릴리이드K','프리배리','스컬트라','레스틸렌'];
var p=['대웅바이오','JW중외제약','팜젠사이언스','한국비엠아이','웨일즈메디','아주약품','한국휴텍스제약'];
var ic='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a5c3a" stroke-width="1.5"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4a4 4 0 018 0v2"/></svg>';
document.getElementById('device-grid').innerHTML=d.map(function(n){return'<div class="card"><div class="card-icon">'+ic+'</div><div class="card-name">'+n+'</div><div class="card-type">의료기기</div><button class="card-btn">자료 요청</button></div>';}).join('');
document.getElementById('pharma-grid').innerHTML=p.map(function(n){return'<div class="pharma-card">'+n+'</div>';}).join('');
function showTab(t){document.getElementById('tab-device').classList.toggle('hidden',t!=='device');document.getElementById('tab-pharma').classList.toggle('hidden',t!=='pharma');document.querySelectorAll('.tab').forEach(function(el,i){el.classList.toggle('active',(i===0&&t==='device')||(i===1&&t==='pharma'));});}
</script>
</body>
</html>
