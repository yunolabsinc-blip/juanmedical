<body>
<header>
  <h1>주안메디칼</h1>
  <p>의료기기 · 전문의약품 취급</p>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('device')">의료기기 (10)</button>
  <button class="tab" onclick="showTab('pharma')">전문의약품 (7)</button>
</div>
<div class="content">
  <div id="tab-device">
    <p class="section-label">취급 의료기기 목록 — 카드를 클릭하면 상세 정보를 볼 수 있습니다.</p>
    <div class="grid" id="device-grid"></div>
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <div class="detail-title" id="detail-title"></div>
        <button class="detail-close" onclick="closeDetail()">×</button>
      </div>
      <table class="detail-table" id="detail-table"></table>
      <div class="detail-actions">
        <button class="btn-primary" onclick="callContact()">전화 문의</button>
        <button class="btn-secondary" id="brochure-btn" style="display:none">브로셔 다운로드</button>
      </div>
    </div>
  </div>
  <div id="tab-pharma" class="hidden">
    <p class="section-label">파트너 제약사 — 제품 문의는 하단 연락처로 주세요.</p>
    <div class="pharma-grid" id="pharma-grid"></div>
  </div>
  <div class="contact-bar">
    <div>
      <p>제품 문의 · 브로셔 요청</p>
      <strong>주안메디칼 담당자 직통</strong>
    </div>
    <button class="contact-btn" onclick="callContact()">전화 문의</button>
  </div>
</div>
<script>
var devices = [
  {
    name: '블래드케어', eng: 'BLAD-CARE',
    model: 'BPBF-500', maker: '바이오플러스(주)',
    class: '의료기기 4등급 (조직수복용생체재료)',
    unit: '50mL', storage: '직사광선을 피하고 실온 보관',
    purpose: '방광상피의 손상된 GAG(Glycosaminoglycans) 층을 보충하여 일시적으로 방광염 증상 개선',
    brochure: ''
  },
  { name: '수술엔', eng: 'SUSUL-N', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '운드클랏', eng: 'WOUNDCLOT', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '리젠씰', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '카티졸', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '리젠패치', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '릴리이드K', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '프리배리', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '스컬트라', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' },
  { name: '레스틸렌', eng: '', model: '', maker: '', class: '', unit: '', storage: '', purpose: '', brochure: '' }
];
var pharmas = ['대웅바이오','JW중외제약','팜젠사이언스','한국비엠아이','웨일즈메디','아주약품','한국휴텍스제약'];
var ic = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a5c3a" stroke-width="1.5"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4a4 4 0 018 0v2"/></svg>';
var activeIdx = -1;
var grid = document.getElementById('device-grid');
devices.forEach(function(d, i) {
  var el = document.createElement('div');
  el.className = 'card';
  el.id = 'card-' + i;
  el.innerHTML = '<div class="card-icon">' + ic + '</div><div class="card-name">' + d.name + '</div><div class="card-sub">' + (d.eng || '의료기기') + '</div>';
  el.onclick = function() { toggleDetail(i); };
  grid.appendChild(el);
});
document.getElementById('pharma-grid').innerHTML = pharmas.map(function(n){ return '<div class="pharma-card">' + n + '</div>'; }).join('');
function toggleDetail(i) {
  if (activeIdx === i) { closeDetail(); return; }
  if (activeIdx >= 0) document.getElementById('card-' + activeIdx).classList.remove('active');
  activeIdx = i;
  document.getElementById('card-' + i).classList.add('active');
  var d = devices[i];
  document.getElementById('detail-title').innerHTML = d.name + '<span>' + d.eng + '</span>';
  var rows = [
    ['모델명', d.model], ['제조사', d.maker], ['분류', d.class],
    ['포장 단위', d.unit], ['저장 방법', d.storage], ['사용 목적', d.purpose]
  ];
  document.getElementById('detail-table').innerHTML = rows.filter(function(r){ return r[1]; }).map(function(r){
    return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('');
  var bb = document.getElementById('brochure-btn');
  if (d.brochure) { bb.style.display = 'inline-block'; bb.onclick = function(){ window.open(d.brochure); }; }
  else { bb.style.display = 'none'; }
  var panel = document.getElementById('detail-panel');
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closeDetail() {
  if (activeIdx >= 0) document.getElementById('card-' + activeIdx).classList.remove('active');
  activeIdx = -1;
  document.getElementById('detail-panel').classList.remove('show');
}
function showTab(t) {
  document.getElementById('tab-device').classList.toggle('hidden', t !== 'device');
  document.getElementById('tab-pharma').classList.toggle('hidden', t !== 'pharma');
  document.querySelectorAll('.tab').forEach(function(el, i){ el.classList.toggle('active', (i===0&&t==='device')||(i===1&&t==='pharma')); });
}
function callContact() { window.location.href = 'tel:010-0000-0000'; }
</script>
</body>
</html>
